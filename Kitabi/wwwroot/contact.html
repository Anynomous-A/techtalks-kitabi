<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Kitabi</title>
    <meta name="description" content="Get in touch with the Kitabi team." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

    <!-- ===== Header ===== -->
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html" aria-label="Kitabi home">
                <img src="uploads/logo.png" alt="Kitabi" />
            </a>
            <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
            <nav class="main-nav" aria-label="Main">
                <a href="index.html">Home</a>
                <a href="index.html#books">Browse Books</a>
                <a href="post-listing.html" id="sellLink">Sell a Book</a>
                <a href="Help.html">Help</a>
            </nav>
            <div class="header-actions">
                <a href="login.html" id="loginLink" class="header-link"><span>Login</span></a>
                <button type="button" id="logoutBtn" class="header-link" hidden><span>Logout</span></button>
                <a href="profile.html" id="profileLink" class="icon-btn" aria-label="Account"><span>Profile</span></a>
            </div>
        </div>
    </header>

    <main class="container page">

        <section class="page-hero">
            <h1>Contact Us</h1>
            <p>Have a question, feedback or a bug to report? We'd love to hear from you.</p>
        </section>

        <section class="section">
            <div class="contact-simple">

                <div class="mail-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2" />
                        <path d="m3 7 9 6 9-6" />
                    </svg>
                </div>

                <h2>Email us</h2>
                <p class="muted">We usually reply within 24 hours.</p>

                <a href="mailto:support@kitabi.com" class="mail-link">
                    support@kitabi.com
                </a>

            </div>
        </section>

    </main>

    <!-- ===== Footer ===== -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <img src="uploads/logo.png" alt="Kitabi" />
                <p>Buy • Sell • Share Books</p>
            </div>
            <nav class="footer-links" aria-label="Footer">
                <a href="about.html">About</a>
                <a href="how-it-works.html">How it works</a>
                <a href="faq.html">FAQ</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="footer-side">
                <small>© <span id="year">2026</span> Kitabi. All rights reserved.</small>
            </div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
